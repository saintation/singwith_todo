<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singwith To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { color-scheme: dark; }
        body { font-family: 'Pretendard', sans-serif; background-color: #0F0F0F; color: #FFFFFF; }
        .details-content { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .details-content.open { max-height: 400px; opacity: 1; margin-top: 1rem; }
        
        .loading-overlay { backdrop-filter: blur(8px); background: rgba(15, 15, 15, 0.9); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .syncing { animation: pulse 1.5s infinite; }
        
        input[type="date"] { font-family: inherit; background: #252525; border-radius: 8px; border: 1px solid #333; cursor: pointer; color: #E0E0E0; outline: none; transition: border-color 0.2s;}
        input[type="date"]:focus { border-color: #FF6B6B; }
        
        /* 세부 영역 내 날짜 수정 인풋 스타일 */
        .edit-date-input { background: #1A1A1A; border: 1px solid #333; color: #E0E0E0; cursor: pointer; border-radius: 6px; }
        .edit-date-input:focus { border-color: #FF6B6B; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="loginLayer" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0F0F0F]">
        <div class="w-full max-w-sm p-8 text-center">
            <h1 class="text-3xl font-black mb-10 tracking-tighter text-[#FF6B6B]">Singwith To-Do List</h1>
            <input type="text" id="repoInput" placeholder="리포지토리 (예: username/repo)" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-4 outline-none focus:border-[#FF6B6B] transition-all text-white">
            <input type="password" id="patInput" placeholder="GitHub PAT (Access Token)" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-8 outline-none focus:border-[#FF6B6B] transition-all text-white">
            <button onclick="initialize()" class="w-full bg-[#FF6B6B] text-white py-4 rounded-xl font-bold hover:bg-[#e55a5a] active:scale-95 transition-all shadow-lg">접속하기</button>
        </div>
    </div>
