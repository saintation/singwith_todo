<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singwith To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { color-scheme: dark; }
        body { font-family: 'Pretendard', sans-serif; background-color: #0F0F0F; color: #FFFFFF; }
        
        .details-content { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .details-content.open { max-height: 400px; opacity: 1; margin-top: 1rem; }
        
        .loading-overlay { backdrop-filter: blur(8px); background: rgba(15, 15, 15, 0.8); }
        .mini-spinner { border: 2px solid #333; border-top-color: #FF6B6B; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        input[type="date"], input[type="text"], textarea { font-family: inherit; outline: none; transition: border-color 0.2s; }
        input[type="date"] { background: #252525; border-radius: 8px; border: 1px solid #333; cursor: pointer; color: #E0E0E0; }
        input[type="date"]:focus { border-color: #FF6B6B; }
        .edit-date-input { background: #1A1A1A; border: 1px solid #333; color: #E0E0E0; cursor: pointer; border-radius: 6px; }
        .edit-date-input:focus { border-color: #FF6B6B; }
        
        .search-input-group:focus-within svg { color: #FF6B6B; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="loginLayer" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0F0F0F]">
        <div class="w-full max-w-sm p-8 text-center">
            <h1 class="text-3xl font-black mb-10 tracking-tighter text-[#FF6B6B]">Singwith To-Do List</h1>
            <input type="text" id="repoInput" placeholder="리포지토리 (예: username/repo)" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-4 text-white">
            <input type="password" id="patInput" placeholder="GitHub PAT (Access Token)" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-8 text-white">
            <button onclick="initialize()" class="w-full bg-[#FF6B6B] text-white py-4 rounded-xl font-bold hover:bg-[#e55a5a] active:scale-95 transition-all shadow-lg">접속하기</button>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 z-40 loading-overlay flex items-center justify-center hidden">
        <div class="text-[#FF6B6B] font-bold tracking-[0.2em] animate-pulse">SYNCING...</div>
    </div>

    <div id="app" class="hidden w-full max-w-[550px] h-[90vh] bg-[#1A1A1A] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-800/50 relative">
        <div class="p-6 md:p-10 flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-end mb-6">
                <h2 id="viewTitle" class="text-3xl font-bold tracking-tight text-white">Active Tasks</h2>
                <button onclick="toggleView()" id="viewBtn" class="text-sm font-medium text-gray-500 hover:text-[#FF6B6B] transition-colors pb-1 border-b border-transparent hover:border-[#FF6B6B]">Archive →</button>
            </div>

            <div id="searchSection" class="mb-4 search-input-group relative hidden">
                <svg class="w-4 h-4 text-gray-500 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="검색어 입력 후 Enter..." class="w-full bg-[#222222] border border-gray-800 rounded-xl py-2.5 pl-11 pr-4 focus:border-[#FF6B6B] text-sm text-white placeholder-gray-500 shadow-sm">
            </div>

            <div id="inputSection" class="mb-6 space-y-3 block">
                <div class="flex gap-3 items-center">
                    <input type="text" id="newTodo" placeholder="What's next?" class="flex-1 bg-transparent border-b-2 border-gray-800 py-2 focus:border-[#FF6B6B] text-lg font-medium text-white">
                    <button onclick="addTask()" class="bg-[#FF6B6B] text-white px-5 py-2.5 rounded-xl font-bold hover:bg-[#e55a5a] active:scale-95 transition-all shadow-md shrink-0">Add</button>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-400 font-medium whitespace-nowrap">목표일 (선택):</span>
                    <input type="date" id="newDate" class="flex-1 max-w-[160px] text-sm py-1.5 px-3">
                </div>
            </div>

            <div id="archiveFilterSection" class="mb-6 hidden">
                <div class="flex flex-col gap-3 bg-[#222222] p-4 rounded-xl border border-gray-800">
                    <label class="text-sm text-[#FF6B6B] font-bold">조회 기간 (완료일 기준)</label>
                    <div class="flex items-center gap-2">
                        <input type="date" id="filterStart" class="flex-1 text-sm py-2 px-3">
                        <span class="text-gray-500 font-bold">~</span>
                        <input type="date" id="filterEnd" class="flex-1 text-sm py-2 px-3">
                        <button onclick="reloadTasks(true)" class="bg-gray-800 text-xs px-3 py-2 rounded text-white hover:bg-gray-700">조회</button>
                    </div>
                </div>
            </div>

            <ul id="todoList" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar pb-10"></ul>
            <div id="bottomLoading" class="hidden justify-center items-center py-2 text-gray-500 text-xs gap-2">
                <div class="mini-spinner"></div> Loading more...
            </div>
        </div>
    </div>

    <script>
        let GITHUB_TOKEN = '';
        let REPO = '';
        let todos = [];
        let isArchiveView = false;
        let searchQuery = '';
        
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;

        const todayDate = new Date();
        const lastWeekDate = new Date();
        lastWeekDate.setDate(todayDate.getDate() - 7);
        document.getElementById('filterEnd').value = todayDate.toISOString().split('T')[0];
        document.getElementById('filterStart').value = lastWeekDate.toISOString().split('T')[0];

        document.getElementById('newTodo').addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); addTask(); }});
        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') reloadTasks(true); });
        
        document.getElementById('todoList').addEventListener('scroll', function(e) {
            const { scrollTop, scrollHeight, clientHeight } = e.target;
            if (scrollTop + clientHeight >= scrollHeight - 10) {
                if(!isFetching && hasMore) fetchTasks(currentPage + 1);
            }
        });

        function getHighlightedText(text, query) {
            if (!query || !text) return text || '';
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return safeText.replace(regex, `<span class="bg-[#FF6B6B] text-white px-1 rounded-sm">$1</span>`);
        }

        async function initialize() {
            REPO = document.getElementById('repoInput').value.trim();
            GITHUB_TOKEN = document.getElementById('patInput').value.trim();
            if(!GITHUB_TOKEN || !REPO) return alert('정보를 입력하세요.');
            
            document.getElementById('loading').classList.remove('hidden');
            try {
                const testRes = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` }});
                if (!testRes.ok) throw new Error('Repository Not Found');
                
                await fetchTasks(1, true);
                document.getElementById('loginLayer').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            } catch (e) { alert('연결 실패. 입력 정보를 확인하세요.'); } 
            finally { document.getElementById('loading').classList.add('hidden'); }
        }

        async function reloadTasks(reset = false) {
            if (reset) {
                currentPage = 1;
                hasMore = true;
                todos = [];
                document.getElementById('todoList').innerHTML = '';
            }
            if(isArchiveView) searchQuery = document.getElementById('searchInput').value.trim();
            await fetchTasks(currentPage);
        }

        async function fetchTasks(page = 1, isInitial = false) {
            if(isFetching || !hasMore) return;
            isFetching = true;
            if(!isInitial) document.getElementById('bottomLoading').classList.remove('hidden');

            try {
                let url;
                if (isArchiveView) {
                    const start = document.getElementById('filterStart').value;
                    const end = document.getElementById('filterEnd').value;
                    let q = `repo:${REPO} is:issue state:closed closed:${start}..${end}`;
                    if(searchQuery) q += ` ${searchQuery} in:title,body`;
                    url = `https://api.github.com/search/issues?q=${encodeURIComponent(q)}&sort=updated&order=desc&per_page=20&page=${page}`;
                } else {
                    url = `https://api.github.com/repos/${REPO}/issues?state=open&sort=updated&direction=desc&per_page=20&page=${page}`;
                }

                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
                if (!res.ok) throw new Error('Fetch failed');
                
                const data = await res.json();
                const items = isArchiveView ? data.items : data;
                
                if (items.length < 20) hasMore = false;

                const newTodos = items.filter(i => !i.pull_request && !i.labels.some(l => l.name === 'deleted')).map(issue => {
                    const targetLabel = issue.labels.find(l => l.name.startsWith('target:'));
                    const existing = todos.find(t => t.id === issue.number);
                    if(existing) return existing;

                    return {
                        id: issue.number,
                        text: issue.title,
                        memo: issue.body || '',
                        date: targetLabel ? targetLabel.name.replace('target:', '') : '',
                        completed: issue.state === 'closed',
                        completedAt: issue.closed_at ? issue.closed_at.split('T')[0] : null,
                        _isOpen: false
                    };
                }).filter(Boolean);

                if (page === 1) todos = newTodos;
                else todos = [...todos, ...newTodos];
                
                currentPage = page;
                render();
            } catch (e) { console.error(e); } 
            finally { 
                isFetching = false; 
                document.getElementById('bottomLoading').classList.add('hidden'); 
            }
        }

        async function apiRequest(endpoint, method, payload) {
            const res = await fetch(`https://api.github.com/repos/${REPO}/issues${endpoint}`, {
                method: method,
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('API Update Failed');
            return await res.json();
        }

        // 백그라운드 자동 로그 기록 함수 (성공/실패를 앱 UI에 표출하지 않음)
        function postAutoLog(issueId, message) {
            apiRequest(`/${issueId}/comments`, 'POST', { body: message }).catch(e => console.error("Auto-log failed", e));
        }

        function render() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            
            let displayTodos = [...todos];
            
            if (isArchiveView) {
                displayTodos.sort((a, b) => {
                    if (a.completedAt && b.completedAt) {
                        return a.completedAt > b.completedAt ? -1 : (a.completedAt < b.completedAt ? 1 : 0);
                    }
                    return 0;
                });
            } else {
                displayTodos.sort((a, b) => {
                    if (a.date && b.date) return a.date === b.date ? a.text.localeCompare(b.text) : (a.date < b.date ? -1 : 1);
                    if (a.date) return -1;
                    if (b.date) return 1;
                    return a.text.localeCompare(b.text);
                });
            }

            if (searchQuery && isArchiveView) {
                displayTodos = displayTodos.filter(t => {
                    const titleMatch = t.text.toLowerCase().includes(searchQuery);
                    const memoMatch = t.memo && t.memo.toLowerCase().includes(searchQuery);
                    return titleMatch || memoMatch;
                });
            }

            if (displayTodos.length === 0) {
                const emptyMessage = (searchQuery && isArchiveView)
                    ? `"<span class="text-[#FF6B6B]">${searchQuery}</span>" 검색 결과가 없습니다.` 
                    : "항목이 없습니다.";
                list.innerHTML = `<li class="text-center py-10 text-gray-500 font-medium">${emptyMessage}</li>`;
                return;
            }
            
            displayTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `group bg-[#222222] p-5 md:p-6 rounded-2xl border border-transparent hover:border-gray-800 transition-all ${todo.completed ? 'opacity-80' : 'shadow-sm'}`;
                
                const isTemp = String(todo.id).startsWith('temp-');
                const isMemoMatched = isArchiveView && searchQuery && todo.memo && todo.memo.toLowerCase().includes(searchQuery);
                const displayTitle = (isArchiveView && searchQuery) ?
