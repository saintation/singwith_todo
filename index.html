<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singwith To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { color-scheme: dark; }
        body { font-family: 'Pretendard', sans-serif; background-color: #0F0F0F; color: #FFFFFF; }
        .details-content { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .details-content.open { max-height: 400px; opacity: 1; margin-top: 1rem; }
        
        .loading-overlay { backdrop-filter: blur(8px); background: rgba(15, 15, 15, 0.9); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .syncing { animation: pulse 1.5s infinite; }
        
        input[type="date"] { font-family: inherit; background: #252525; border-radius: 8px; border: 1px solid #333; cursor: pointer; color: #E0E0E0; outline: none; transition: border-color 0.2s;}
        input[type="date"]:focus { border-color: #FF6B6B; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="loginLayer" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0F0F0F]">
        <div class="w-full max-w-sm p-8 text-center">
            <h1 class="text-3xl font-black mb-10 tracking-tighter text-[#FF6B6B]">Singwith To-Do List</h1>
            <input type="text" id="repoInput" placeholder="리포지토리 (예: username/repo)" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-4 outline-none focus:border-[#FF6B6B] transition-all text-white">
            <input type="password" id="patInput" placeholder="GitHub PAT (Access Token)" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-8 outline-none focus:border-[#FF6B6B] transition-all text-white">
            <button onclick="initialize()" class="w-full bg-[#FF6B6B] text-white py-4 rounded-xl font-bold hover:bg-[#e55a5a] active:scale-95 transition-all shadow-lg">접속하기</button>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 z-40 loading-overlay flex items-center justify-center hidden">
        <div class="text-[#FF6B6B] font-bold tracking-[0.2em] syncing">SYNCING...</div>
    </div>

    <div id="app" class="hidden w-full max-w-[550px] h-[90vh] bg-[#1A1A1A] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-800/50">
        <div class="p-6 md:p-10 flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-end mb-8">
                <h2 id="viewTitle" class="text-3xl font-bold tracking-tight text-white">Active Tasks</h2>
                <button onclick="toggleView()" id="viewBtn" class="text-sm font-medium text-gray-500 hover:text-[#FF6B6B] transition-colors pb-1 border-b border-transparent hover:border-[#FF6B6B]">Archive ➔</button>
            </div>

            <div id="inputSection" class="mb-8 space-y-3 block">
                <div class="flex gap-3 items-center">
                    <input type="text" id="newTodo" onkeypress="if(event.key==='Enter') addTask()" placeholder="What's next?" class="flex-1 bg-transparent border-b-2 border-gray-800 py-2 outline-none focus:border-[#FF6B6B] transition-all text-lg font-medium">
                    <button onclick="addTask()" class="bg-[#FF6B6B] text-white px-5 py-2.5 rounded-xl font-bold hover:bg-[#e55a5a] active:scale-95 transition-all shadow-md shrink-0">Add</button>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-400 font-medium whitespace-nowrap">목표일 (선택) :</span>
                    <input type="date" id="newDate" class="flex-1 max-w-[160px] text-sm py-1.5 px-3">
                </div>
            </div>

            <div id="archiveFilterSection" class="mb-8 hidden">
                <div class="flex flex-col gap-3 bg-[#222222] p-4 rounded-xl border border-gray-800">
                    <label class="text-sm text-[#FF6B6B] font-bold">조회 기간 (완료일 기준)</label>
                    <div class="flex items-center gap-2">
                        <input type="date" id="filterStart" class="flex-1 text-sm py-2 px-3" onchange="render()">
                        <span class="text-gray-500 font-bold">~</span>
                        <input type="date" id="filterEnd" class="flex-1 text-sm py-2 px-3" onchange="render()">
                    </div>
                </div>
            </div>

            <ul id="todoList" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar"></ul>
        </div>
    </div>

    <script>
        let GITHUB_TOKEN = '';
        let REPO = '';
        let currentSha = '';
        let todos = [];
        let isArchiveView = false;

        // 초기 필터 날짜 세팅 (오늘 기준 최근 7일)
        const todayDate = new Date();
        const lastWeekDate = new Date();
        lastWeekDate.setDate(todayDate.getDate() - 7);
        document.getElementById('filterEnd').value = todayDate.toISOString().split('T')[0];
        document.getElementById('filterStart').value = lastWeekDate.toISOString().split('T')[0];

        async function initialize() {
            REPO = document.getElementById('repoInput').value.trim();
            GITHUB_TOKEN = document.getElementById('patInput').value.trim();
            
            if(!GITHUB_TOKEN || !REPO) return alert('리포지토리와 토큰을 입력하세요.');
            
            toggleLoading(true);
            try {
                await fetchData();
                document.getElementById('loginLayer').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            } catch (e) { alert('연결 실패: 리포지토리명과 토큰을 재확인하세요.'); } 
            finally { toggleLoading(false); }
        }

        async function fetchData() {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            currentSha = data.sha;
            todos = JSON.parse(decodeURIComponent(escape(atob(data.content))));
            render();
        }

        async function pushData() {
            toggleLoading(true);
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(todos, null, 2))));
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/contents/data.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Sync Todo", content, sha: currentSha })
                });
                const resData = await res.json();
                currentSha = resData.content.sha;
            } catch (e) { alert('동기화 실패'); } 
            finally { toggleLoading(false); }
        }

        function render() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            
            let filtered = [];
            if (isArchiveView) {
                const startStr = document.getElementById('filterStart').value;
                const endStr = document.getElementById('filterEnd').value;
                filtered = todos.filter(t => t.completed && t.completedAt >= startStr && t.completedAt <= endStr);
            } else {
                filtered = todos.filter(t => !t.completed);
            }

            if (filtered.length === 0) {
                list.innerHTML = `<li class="text-center py-10 text-gray-500 font-medium">항목이 없습니다.</li>`;
                return;
            }
            
            filtered.forEach(todo => {
                const li = document.createElement('li');
                li.className = `group bg-[#222222] p-5 md:p-6 rounded-2xl border border-transparent hover:border-gray-800 transition-all ${todo.completed ? 'opacity-80' : 'shadow-sm'}`;
                
                // 가독성을 대폭 높인 날짜 표시 로직
                const dateHtml = todo.date 
                    ? `<div class="text-xs md:text-sm font-semibold text-[#FF6B6B] mt-1.5 bg-[#FF6B6B10] w-fit px-2.5 py-1 rounded">마감 목표: ${todo.date}</div>` 
                    : '';
                const archiveDateHtml = todo.completedAt 
                    ? `<div class="text-xs md:text-sm font-semibold text-gray-300 mt-1.5 bg-[#333333] w-fit px-2.5 py-1 rounded">✅ 완료됨: ${todo.completedAt}</div>` 
                    : '';

                li.innerHTML = `
                    <div class="flex items-start gap-4 cursor-pointer">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} class="mt-1 w-6 h-6 accent-[#FF6B6B] rounded-lg cursor-pointer shrink-0">
                        <div class="flex-1 min-w-0" onclick="this.parentElement.nextElementSibling.classList.toggle('open')">
                            <p class="text-[16px] md:text-[18px] font-bold tracking-tight leading-snug ${todo.completed ? 'line-through text-gray-500' : 'text-white'}">${todo.text}</p>
                            ${isArchiveView ? archiveDateHtml : dateHtml}
                        </div>
                    </div>
                    <div class="details-content">
                        <textarea class="w-full bg-[#141414] p-4 md:p-5 rounded-xl text-sm leading-relaxed text-gray-200 mt-3 outline-none border border-gray-800 focus:border-[#FF6B6B] h-28" placeholder="메모 추가...">${todo.memo || ''}</textarea>
                    </div>
                `;
                
                const cb = li.querySelector('input[type="checkbox"]');
                cb.onchange = () => {
                    todo.completed = cb.checked;
                    todo.completedAt = cb.checked ? new Date().toISOString().split('T')[0] : null;
                    pushData().then(render);
                };

                const ta = li.querySelector('textarea');
                ta.onchange = () => { todo.memo = ta.value; pushData(); };
                list.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('newTodo');
            const date = document.getElementById('newDate');
            if(!input.value.trim()) return;
            todos.unshift({ id: Date.now(), text: input.value.trim(), date: date.value, memo: '', completed: false });
            input.value = ''; 
            date.value = ''; // 등록 후 날짜 초기화
            pushData().then(render);
        }

        function toggleView() {
            isArchiveView = !isArchiveView;
            document.getElementById('viewTitle').innerText = isArchiveView ? 'Archives' : 'Active Tasks';
            document.getElementById('viewBtn').innerText = isArchiveView ? '➔ Active' : 'Archive ➔';
            document.getElementById('inputSection').style.display = isArchiveView ? 'none' : 'block';
            document.getElementById('archiveFilterSection').style.display = isArchiveView ? 'block' : 'none';
            render();
        }

        function toggleLoading(show) { document.getElementById('loading').classList.toggle('hidden', !show); }
    </script>
</body>
</html>
