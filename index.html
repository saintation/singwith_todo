<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singwith To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root { color-scheme: dark; }
        body { font-family: 'Pretendard', sans-serif; background-color: #0F0F0F; color: #FFFFFF; }
        
        .details-content { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .details-content.open { max-height: 2000px; opacity: 1; margin-top: 0.5rem; } 
        
        .loading-overlay { backdrop-filter: blur(8px); background: rgba(15, 15, 15, 0.8); }
        .mini-spinner { border: 2px solid #333; border-top-color: #FF6B6B; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        input[type="date"], input[type="text"], textarea { font-family: inherit; outline: none; transition: border-color 0.2s, background-color 0.2s; }
        textarea { resize: none; overflow: hidden; min-height: 52px; }
        
        .search-input-group:focus-within svg { color: #FF6B6B; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="loginLayer" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0F0F0F]">
        <div class="w-full max-w-sm p-8 text-center">
            <h1 class="text-3xl font-black mb-10 tracking-tighter text-[#FF6B6B]">Singwith To-Do List</h1>
            <input type="text" id="repoInput" placeholder="리포지토리 (예: username/repo)" class="w-full min-w-0 bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-4 text-white">
            <input type="password" id="patInput" placeholder="GitHub PAT (Access Token)" class="w-full min-w-0 bg-[#1A1A1A] border border-gray-800 rounded-xl p-4 mb-8 text-white">
            <button onclick="initialize()" class="w-full bg-[#FF6B6B] text-white py-4 rounded-xl font-bold hover:bg-[#e55a5a] active:scale-95 transition-all shadow-lg">접속하기</button>
        </div>
    </div>

    <div id="loading" class="fixed inset-0 z-40 loading-overlay flex items-center justify-center hidden">
        <div class="text-[#FF6B6B] font-bold tracking-[0.2em] animate-pulse">SYNCING...</div>
    </div>

    <div id="app" class="hidden w-full max-w-[550px] md:max-w-[750px] lg:max-w-[850px] h-[90vh] bg-[#1A1A1A] rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-800/50 relative transition-all duration-300">
        <div class="p-6 md:p-10 flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-end mb-6">
                <h2 id="viewTitle" class="text-3xl font-bold tracking-tight text-white">Active Tasks</h2>
                <button onclick="toggleView()" id="viewBtn" class="text-sm font-medium text-gray-500 hover:text-[#FF6B6B] transition-colors pb-1 border-b border-transparent hover:border-[#FF6B6B]">Archive →</button>
            </div>

            <div id="searchSection" class="mb-4 search-input-group hidden flex gap-2 w-full">
                <div class="relative flex-1">
                    <svg class="w-4 h-4 text-gray-500 absolute left-4 top-1/2 transform -translate-y-1/2 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="검색어 입력 후 Enter..." class="w-full bg-[#222222] border border-gray-800 rounded-xl py-2.5 pl-11 pr-4 focus:border-[#FF6B6B] text-sm text-white placeholder-gray-500 shadow-sm">
                </div>
                <button onclick="reloadTasks(true)" class="bg-[#252525] border border-gray-800 text-gray-300 w-[42px] h-[42px] md:px-4 md:w-auto rounded-xl hover:bg-[#FF6B6B] hover:text-white hover:border-[#FF6B6B] flex items-center justify-center shrink-0 transition-all shadow-sm">
                    <svg class="w-5 h-5 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span class="hidden md:inline text-sm font-bold">조회</span>
                </button>
            </div>

            <div id="inputSection" class="mb-6 space-y-3 block">
                <div class="flex gap-3 items-center w-full">
                    <input type="text" id="newTodo" placeholder="What's next?" class="flex-1 min-w-0 bg-transparent border-b-2 border-gray-800 py-2 focus:border-[#FF6B6B] text-lg font-medium text-white">
                    <button onclick="addTask()" class="bg-[#FF6B6B] text-white px-5 py-2.5 rounded-xl font-bold hover:bg-[#e55a5a] active:scale-95 transition-all shadow-md shrink-0">Add</button>
                </div>
                <div class="flex items-center gap-3 w-full">
                    <span class="text-sm text-gray-400 font-medium whitespace-nowrap shrink-0">목표일 (선택):</span>
                    <input type="date" id="newDate" class="flex-1 min-w-0 max-w-[160px] text-sm py-1.5 px-3 bg-[#252525] rounded-lg border border-gray-800">
                </div>
            </div>

            <div id="archiveFilterSection" class="mb-6 hidden">
                <div class="flex flex-col md:flex-row gap-3 bg-[#222222] p-4 rounded-xl border border-gray-800 md:items-center">
                    <label class="text-sm text-[#FF6B6B] font-bold shrink-0">조회 기간 (완료일 기준)</label>
                    <div class="flex items-center gap-2 w-full md:flex-1">
                        <input type="date" id="filterStart" class="flex-1 min-w-0 text-sm py-2 px-2 bg-[#1A1A1A] border border-gray-700 rounded-lg">
                        <span class="text-gray-500 font-bold shrink-0">~</span>
                        <input type="date" id="filterEnd" class="flex-1 min-w-0 text-sm py-2 px-2 bg-[#1A1A1A] border border-gray-700 rounded-lg">
                        <button onclick="reloadTasks(true)" class="bg-gray-800 text-gray-400 w-[36px] h-[36px] md:px-3 md:w-auto rounded-lg hover:bg-gray-700 hover:text-white flex items-center justify-center shrink-0 transition-all">
                            <svg class="w-4 h-4 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                            <span class="hidden md:inline text-xs font-bold">조회</span>
                        </button>
                    </div>
                </div>
            </div>

            <ul id="todoList" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar pb-10"></ul>
            <div id="bottomLoading" class="hidden justify-center items-center py-2 text-gray-500 text-xs gap-2">
                <div class="mini-spinner"></div> Loading more...
            </div>
        </div>
    </div>

    <script>
        let GITHUB_TOKEN = '';
        let REPO = '';
        let todos = [];
        let isArchiveView = false;
        let searchQuery = '';
        
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;

        const optimisticCache = new Map();

        const todayDate = new Date();
        const lastWeekDate = new Date();
        lastWeekDate.setDate(todayDate.getDate() - 7);
        document.getElementById('filterEnd').value = todayDate.toISOString().split('T')[0];
        document.getElementById('filterStart').value = lastWeekDate.toISOString().split('T')[0];

        document.getElementById('newTodo').addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); addTask(); }});
        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') reloadTasks(true); });
        
        document.getElementById('todoList').addEventListener('scroll', function(e) {
            const { scrollTop, scrollHeight, clientHeight } = e.target;
            if (scrollTop + clientHeight >= scrollHeight - 10) {
                if(!isFetching && hasMore) fetchTasks(currentPage + 1);
            }
        });

        function getHighlightedText(text, query) {
            if (!query || !text) return text || '';
            const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return safeText.replace(regex, `<span class="bg-[#FF6B6B] text-white px-1 rounded-sm">$1</span>`);
        }

        function updateCache(todo) {
            optimisticCache.set(todo.id, { ...todo, _cachedAt: Date.now() });
        }

        function autoResizeTextarea(ta) {
            ta.style.height = 'auto';
            ta.style.height = (ta.scrollHeight) + 'px';
        }

        async function initialize() {
            REPO = document.getElementById('repoInput').value.trim();
            GITHUB_TOKEN = document.getElementById('patInput').value.trim();
            if(!GITHUB_TOKEN || !REPO) return alert('정보를 입력하세요.');
            
            document.getElementById('loading').classList.remove('hidden');
            try {
                const testRes = await fetch(`https://api.github.com/repos/${REPO}`, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` }});
                if (!testRes.ok) throw new Error('Repository Not Found');
                
                await fetchTasks(1, true);
                document.getElementById('loginLayer').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
            } catch (e) { alert('연결 실패. 입력 정보를 확인하세요.'); } 
            finally { document.getElementById('loading').classList.add('hidden'); }
        }

        async function reloadTasks(reset = false) {
            if (reset) {
                currentPage = 1;
                hasMore = true;
                todos = [];
                document.getElementById('todoList').innerHTML = '';
            }
            if(isArchiveView) searchQuery = document.getElementById('searchInput').value.trim();
            await fetchTasks(currentPage);
        }

        async function fetchTasks(page = 1, isInitial = false) {
            if(isFetching || !hasMore) return;
            isFetching = true;
            if(!isInitial) document.getElementById('bottomLoading').classList.remove('hidden');

            try {
                const now = Date.now();
                for (const [id, task] of optimisticCache.entries()) {
                    if (now - task._cachedAt > 30000) optimisticCache.delete(id);
                }

                let url;
                if (isArchiveView) {
                    const start = document.getElementById('filterStart').value;
                    const end = document.getElementById('filterEnd').value;
                    let q = `repo:${REPO} is:issue state:closed closed:${start}..${end}`;
                    if(searchQuery) q += ` ${searchQuery} in:title,body`;
                    url = `https://api.github.com/search/issues?q=${encodeURIComponent(q)}&sort=updated&order=desc&per_page=20&page=${page}`;
                } else {
                    url = `https://api.github.com/repos/${REPO}/issues?state=open&sort=updated&direction=desc&per_page=20&page=${page}`;
                }

                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
                if (!res.ok) throw new Error('Fetch failed');
                
                const data = await res.json();
                const items = isArchiveView ? data.items : data;
                
                if (items.length < 20) hasMore = false;

                const newTodos = items.filter(i => !i.pull_request && !i.labels.some(l => l.name === 'deleted')).map(issue => {
                    const targetLabel = issue.labels.find(l => l.name.startsWith('target:'));
                    
                    let parsedTask = {
                        id: issue.number,
                        text: issue.title,
                        memo: issue.body || '',
                        date: targetLabel ? targetLabel.name.replace('target:', '') : '',
                        completed: issue.state === 'closed',
                        completedAt: issue.closed_at ? issue.closed_at.split('T')[0] : null,
                        _isOpen: !!(issue.body && issue.body.trim()) 
                    };

                    if (optimisticCache.has(parsedTask.id)) {
                        const cached = optimisticCache.get(parsedTask.id);
                        if (parsedTask.completed === cached.completed && parsedTask.memo === cached.memo && parsedTask.date === cached.date) {
                            optimisticCache.delete(parsedTask.id); 
                        } else {
                            parsedTask = { ...cached }; 
                        }
                    }
                    return parsedTask;
                }).filter(Boolean);

                const fetchedIds = new Set(newTodos.map(t => t.id));
                for (const [id, cached] of optimisticCache.entries()) {
                    if (!fetchedIds.has(id)) {
                        if (isArchiveView && cached.completed) newTodos.push(cached);
                        else if (!isArchiveView && !cached.completed) newTodos.push(cached);
                    }
                }

                if (page === 1) todos = newTodos;
                else {
                    const existingIds = new Set(todos.map(t => t.id));
                    newTodos.forEach(nt => { if(!existingIds.has(nt.id)) todos.push(nt); });
                }
                
                currentPage = page;
                render();
            } catch (e) { console.error(e); } 
            finally { 
                isFetching = false; 
                document.getElementById('bottomLoading').classList.add('hidden'); 
            }
        }

        async function apiRequest(endpoint, method, payload) {
            const res = await fetch(`https://api.github.com/repos/${REPO}/issues${endpoint}`, {
                method: method,
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('API Update Failed');
            return await res.json();
        }

        function postAutoLog(issueId, message) {
            apiRequest(`/${issueId}/comments`, 'POST', { body: message }).catch(e => console.error("Auto-log failed", e));
        }

        function render() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            
            let displayTodos = [...todos];
            
            if (isArchiveView) {
                displayTodos = displayTodos.filter(t => t.completed);
                displayTodos.sort((a, b) => {
                    if (a.completedAt && b.completedAt) return a.completedAt > b.completedAt ? -1 : (a.completedAt < b.completedAt ? 1 : 0);
                    return 0;
                });
            } else {
                displayTodos = displayTodos.filter(t => !t.completed);
                displayTodos.sort((a, b) => {
                    if (a.date && b.date) return a.date === b.date ? a.text.localeCompare(b.text) : (a.date < b.date ? -1 : 1);
                    if (a.date) return -1;
                    if (b.date) return 1;
                    return a.text.localeCompare(b.text);
                });
            }

            if (searchQuery && isArchiveView) {
                displayTodos = displayTodos.filter(t => {
                    const titleMatch = t.text.toLowerCase().includes(searchQuery);
                    const memoMatch = t.memo && t.memo.toLowerCase().includes(searchQuery);
                    return titleMatch || memoMatch;
                });
            }

            if (displayTodos.length === 0) {
                const emptyMessage = (searchQuery && isArchiveView) ? `"<span class="text-[#FF6B6B]">${searchQuery}</span>" 검색 결과가 없습니다.` : "항목이 없습니다.";
                list.innerHTML = `<li class="text-center py-10 text-gray-500 font-medium">${emptyMessage}</li>`;
                return;
            }
            
            displayTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `group bg-[#222222] p-5 md:p-6 rounded-2xl border border-transparent hover:border-gray-800 transition-all ${todo.completed ? 'opacity-80' : 'shadow-sm'}`;
                
                const isTemp = String(todo.id).startsWith('temp-');
                const isMemoMatched = isArchiveView && searchQuery && todo.memo && todo.memo.toLowerCase().includes(searchQuery);
                const displayTitle = (isArchiveView && searchQuery) ? getHighlightedText(todo.text, searchQuery) : todo.text;
                const displayMemo = (isArchiveView && searchQuery) ? getHighlightedText(todo.memo, searchQuery) : (todo.memo || '');

                const titleColorClass = todo.completed ? 'line-through text-gray-200' : 'text-white';
                const archiveBadge = `<div class="flex gap-2"><div class="text-[11px] md:text-xs font-semibold text-gray-200 bg-[#1A1A1A] border border-gray-800 w-fit px-2 py-0.5 rounded">🎯 목표: ${todo.date || '없음'}</div><div class="text-[11px] md:text-xs font-semibold text-gray-200 bg-[#1A1A1A] border border-gray-800 w-fit px-2 py-0.5 rounded">✅ 완료: ${todo.completedAt || '알수없음'}</div></div>`;

                const dateInputStyle = todo.date 
                    ? "bg-[#FF6B6B10] text-[#FF6B6B] border border-[#FF6B6B]/40 focus:border-[#FF6B6B]" 
                    : "bg-[#1A1A1A] text-gray-400 border border-gray-700 focus:border-[#FF6B6B]";
                
                const activeDateAndControlsHtml = `
                    <div class="flex items-center justify-between w-full">
                        <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                            <input type="date" class="edit-date-input text-[11px] md:text-xs py-1 px-2 rounded cursor-pointer outline-none transition-colors ${dateInputStyle}" value="${todo.date || ''}" ${isTemp ? 'disabled' : ''}>
                            ${!todo.date ? '<span class="text-[11px] text-gray-500 font-medium cursor-pointer" onclick="this.previousElementSibling.showPicker()">목표일 지정</span>' : ''}
                        </div>
                        <button class="delete-btn text-[11px] text-red-500 bg-red-500/10 hover:bg-red-500/20 px-3 py-1.5 rounded transition-colors font-bold shrink-0" ${isTemp ? 'disabled' : ''}>삭제</button>
                    </div>
                `;

                const memoAreaHtml = isArchiveView 
                    ? `<div class="w-full bg-[#141414] p-4 rounded-xl text-sm text-gray-200 border border-gray-800 min-h-[52px] whitespace-pre-wrap cursor-default mt-2">${displayMemo || '<span class="text-gray-500">메모 없음</span>'}</div>`
                    : `<textarea class="w-full bg-[#141414] p-4 rounded-xl text-sm text-gray-200 border border-gray-800 focus:border-[#FF6B6B] mt-2 custom-scrollbar auto-resize" rows="1" placeholder="메모 추가..." ${isTemp ? 'disabled' : ''}>${todo.memo}</textarea>`;
                
                const detailsOpenClass = isMemoMatched || todo._isOpen ? 'open' : '';

                li.innerHTML = `
                    <div class="flex items-start gap-4 cursor-pointer toggle-area">
                        <input type="checkbox" ${todo.completed ? 'checked' : ''} class="mt-1 w-6 h-6 accent-[#FF6B6B] rounded-lg cursor-pointer shrink-0" ${isTemp ? 'disabled' : ''}>
                        <div class="flex-1 min-w-0">
                            <p class="text-[16px] md:text-[18px] font-bold tracking-tight leading-snug ${titleColorClass}">${displayTitle} ${isTemp ? '<span class="text-xs text-[#FF6B6B] ml-2 animate-pulse">저장 중...</span>' : ''}</p>
                            <div class="mt-1.5 min-h-[20px] flex items-center w-full">
                                ${isArchiveView ? archiveBadge : activeDateAndControlsHtml}
                            </div>
                        </div>
                    </div>
                    <div class="details-content cursor-default ${detailsOpenClass}" onclick="event.stopPropagation()">
                        ${memoAreaHtml}
                    </div>
                `;
                
                li.querySelector('.toggle-area').addEventListener('click', (e) => {
                    if (['input', 'textarea', 'button', 'span'].includes(e.target.tagName.toLowerCase())) return;
                    todo._isOpen = !todo._isOpen;
                    render();
                });

                const cb = li.querySelector('input[type="checkbox"]');
                cb.addEventListener('change', async () => {
                    const originalState = todo.completed;
                    todo.completed = cb.checked;
                    todo.completedAt = cb.checked ? new Date().toISOString().split('T')[0] : null;
                    
                    updateCache(todo);
                    if(todo.completed !== isArchiveView) todos = todos.filter(t => t.id !== todo.id);
                    render();
                    
                    try { 
                        await apiRequest(`/${todo.id}`, 'PATCH', { state: cb.checked ? 'closed' : 'open' }); 
                    } 
                    catch(e) { 
                        optimisticCache.delete(todo.id);
                        todo.completed = originalState;
                        if(todo.completed !== isArchiveView) todos.push(todo);
                        render();
                    }
                });

                if (!isArchiveView && !isTemp) {
                    const ta = li.querySelector('textarea');
                    ta.addEventListener('input', function() { autoResizeTextarea(this); });
                    ta.addEventListener('change', async () => { 
                        const oldMemo = todo.memo;
                        todo.memo = ta.value; 
                        updateCache(todo);
                        try { 
                            await apiRequest(`/${todo.id}`, 'PATCH', { body: ta.value }); 
                            const logContent = ta.value ? `\n> ${ta.value.replace(/\n/g, '\n> ')}` : ' (내용 없음)';
                            postAutoLog(todo.id, `📝 **메모 업데이트:**${logContent}`);
                        } 
                        catch(e) { optimisticCache.delete(todo.id); todo.memo = oldMemo; render(); }
                    });

                    const dateInput = li.querySelector('.edit-date-input');
                    dateInput.addEventListener('change', async (e) => {
                        const oldDate = todo.date;
                        todo.date = e.target.value; 
                        updateCache(todo);
                        render();
                        try {
                            const labels = todo.date ? [`target:${todo.date}`] : [];
                            await apiRequest(`/${todo.id}`, 'PATCH', { labels });
                        } catch(err) { optimisticCache.delete(todo.id); todo.date = oldDate; render(); }
                    });
                }

                const deleteBtn = li.querySelector('.delete-btn');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', async (e) => {
                        e.stopPropagation(); 
                        if(confirm(`해당 태스크를 완전히 삭제하시겠습니까?`)) {
                            const backup = {...todo};
                            todos = todos.filter(t => t.id !== todo.id);
                            optimisticCache.delete(todo.id); 
                            render();
                            try { 
                                await apiRequest(`/${todo.id}`, 'PATCH', { state: 'closed', labels: ['deleted'] }); 
                            } 
                            catch(e) { todos.push(backup); render(); }
                        }
                    });
                }

                list.appendChild(li);
            });

            setTimeout(() => {
                list.querySelectorAll('textarea.auto-resize').forEach(ta => autoResizeTextarea(ta));
            }, 0);
        }

        async function addTask() {
            const input = document.getElementById('newTodo');
            const date = document.getElementById('newDate');
            const titleVal = input.value.trim();
            const dateVal = date.value;
            if(!titleVal) return;
            
            const tempId = 'temp-' + Date.now();
            const tempTask = {
                id: tempId, text: titleVal, memo: '', date: dateVal,
                completed: false, _isOpen: false
            };
            todos.unshift(tempTask);
            input.value = ''; date.value = '';
            render();
            
            try {
                const labels = dateVal ? [`target:${dateVal}`] : [];
                const res = await apiRequest('', 'POST', { title: titleVal, body: '', labels });
                
                const idx = todos.findIndex(t => t.id === tempId);
                if(idx > -1) {
                    todos[idx].id = res.number;
                    updateCache(todos[idx]); 
                    render();
                }
            } catch(e) { 
                todos = todos.filter(t => t.id !== tempId);
                input.value = titleVal;
                render();
            }
        }

        function toggleView() {
            isArchiveView = !isArchiveView;
            
            document.getElementById('viewTitle').innerText = isArchiveView ? 'Archives' : 'Active Tasks';
            document.getElementById('viewBtn').innerText = isArchiveView ? '← Active' : 'Archive →';
            
            document.getElementById('inputSection').style.display = isArchiveView ? 'none' : 'block';
            document.getElementById('searchSection').style.display = isArchiveView ? 'flex' : 'none';
            document.getElementById('archiveFilterSection').style.display = isArchiveView ? 'block' : 'none';
            
            document.getElementById('searchInput').value = '';
            reloadTasks(true);
        }
    </script>
</body>
</html>
